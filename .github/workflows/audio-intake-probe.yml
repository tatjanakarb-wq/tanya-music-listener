name: Audio intake MCP protocol probe

on:
  push:
    paths:
      - "probes/audio_intake/**"
      - "tests/test_audio_intake_probe.py"
      - ".github/workflows/audio-intake-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-mcp-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install current MCP SDK v2
        run: python -m pip install "mcp>=2,<3"
      - name: Assert local MCP client receives actual blind audio content
        run: python -m unittest discover -s tests -p 'test_audio_intake_probe.py' -v
